# Copy to /etc/nginx/sites-available/neighbourguard, symlink into sites-enabled, replace
# YOUR_DOMAIN and the paths, then `sudo nginx -t && sudo systemctl reload nginx`.
# Run certbot afterwards: it rewrites this file to add the TLS block and the port 80 redirect.

# WebSockets need the Upgrade header passed through. This file is included inside nginx's http{},
# so the map belongs here.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Profile photos and issue images are posted from the phone.
    client_max_body_size 10m;

    # Django only serves these itself when DEBUG=True, so in production nginx must.
    location /static/ {
        alias /srv/neighbourguard/staticfiles/;
        access_log off;
        expires 30d;
    }
    location /media/ {
        alias /srv/neighbourguard/media/;
        access_log off;
    }

    # Everything else — the API, the admin, the web app and the chat WebSockets — goes to daphne,
    # which speaks both HTTP and WebSocket on the same port.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django reads this to know the request arrived over TLS (settings.py, HTTPS=True).
        proxy_set_header X-Forwarded-Proto $scheme;
        # A chat socket stays open far longer than a request. Without this nginx closes it at 60 s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
